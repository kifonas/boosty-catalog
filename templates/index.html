<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>%TITLE%</title>
<meta name="description" content="%DESC%">
<link rel="stylesheet" href="%CSS%">
</head>
<body>
<header class="top">
  <div class="brand">
    <h1><a href="#/">%BRAND%</a></h1>
    <p>%TAGLINE%</p>
  </div>
  <div class="controls">
    <input id="search" type="search" placeholder="Поиск по названию…" autocomplete="off">
    <select id="sort" aria-label="Сортировка">
      <option value="default">Сначала новые записи</option>
      <option value="year">По году выпуска</option>
      <option value="title">По названию</option>
      <option value="rating">По оценке Кинопоиска</option>
      <option value="imdb">По оценке IMDb</option>
    </select>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>
<main>
  <div id="grid" class="grid"></div>
  <div id="empty" class="empty" hidden>Ничего не найдено</div>
</main>
<footer class="foot">
  <span>Обновлено: <span id="gen"></span></span>
</footer>
<script src="%JS%"></script>
</body>
</html>
